x;font-weight:700;color:#373538;margin-top:36px;\">ICR — Internal Country Report<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:14px;\">\n            <sc-for list=\"{{ icrMails }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div style=\"border:1px solid #D9D9D9;border-radius:6px;overflow:hidden;\">\n                <div style=\"background:#F7F7F5;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #E7E5E7;\">\n                  <div style=\"font-size:14px;font-weight:700;color:#373538;\">{{ m.trigger }}<\u002Fdiv>\n                  <div style=\"{{ m.condStyle }}\">Conditional<\u002Fdiv>\n                  <span style=\"{{ m.tagStyle }}\">{{ m.tagLabel }}<\u002Fspan>\n                  <div style=\"font-size:14px;color:#7F7D7C;margin-left:auto;text-align:right;\">{{ m.when }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff;padding:22px 24px;\">\n                  <div style=\"display:flex;gap:12px;align-items:flex-start;\">\n                    <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 150 150\" fill=\"#E30A0B\" style=\"flex:none;display:block;margin-top:2px;\"><path d=\"M 150 50.129 L 99.877 50.129 L 99.877 0 L 50.123 0 L 50.123 50.129 L 0 50.129 L 0 99.889 L 50.123 99.889 L 50.123 150 L 99.877 150 L 99.877 99.889 L 150 99.889 L 150 50.129 Z\" fill-rule=\"nonzero\"><\u002Fpath><\u002Fsvg>\n                    <div style=\"flex:1;min-width:0;\">\n                      <div style=\"font-size:14px;color:#7F7D7C;\">From: Globus · Project Management Tool &lt;no-reply@drc.dk&gt;<\u002Fdiv>\n                      <div style=\"font-size:14px;color:#7F7D7C;\">To: {{ m.to }}<\u002Fdiv>\n                      <div style=\"font-size:18px;font-weight:600;color:#373538;margin-top:10px;\">{{ m.subject }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:16px;\">\n                    <sc-for list=\"{{ m.lines }}\" as=\"l\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size:14px;line-height:20px;color:#373538;\">{{ l }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <a href=\"#\" style=\"display:inline-block;background:#E30A0B;color:#fff;border-radius:6px;padding:11px 22px;font-size:14px;font-weight:700;margin-top:18px;text-decoration:none;\">{{ m.cta }}<\u002Fa>\n                  <div style=\"font-size:14px;color:#7F7D7C;margin-top:14px;line-height:20px;\">Kind regards,<br>Globus — Project Management Tool<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#F7F7F5;border-radius:10px;padding:18px 20px;margin-top:28px;\">\n            <div style=\"font-size:14px;font-weight:700;color:#373538;\">Merge fields used<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:20px;color:#6D6B69;margin-top:4px;\">{{ mergeFieldList }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div data-sentinel=\"end\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;right:0;top:0;bottom:0;width:420px;z-index:50;background:#fff;border-left:1px solid #D9D9D9;box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid #E7E5E7;\">\n        <div style=\"font-size:20px;font-weight:700;color:#373538;\">Build notes<\u002Fdiv>\n        <div style=\"margin-left:auto;font-size:14px;font-weight:600;color:#E30A0B;cursor:pointer;\" sc-camel-on-click=\"{{ toggleNotes }}\">Close<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 0;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;\">\n        <sc-for list=\"{{ currentNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <div style=\"background:#F7F7F5;border-radius:10px;padding:14px 16px;\">\n            <div style=\"font-size:14px;font-weight:700;color:#373538;\">{{ n.c }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#6D6B69;line-height:20px;margin-top:5px;\">{{ n.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n<\u002Fdiv>\n<sc-if value=\"{{ showConfirmClose }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;\">\n    <div style=\"width:100%;max-width:520px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.18);padding:26px 28px;\">\n      <div style=\"font-size:20px;font-weight:700;color:#373538;\">You have unsaved changes<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:21px;color:#6D6B69;margin-top:8px;\">This report is not saved automatically. If you close now, your changes since the last save will be lost.<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:22px;\">\n        <div style=\"background:#E30A0B;color:#fff;border-radius:6px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;\" sc-camel-on-click=\"{{ saveAndClose }}\">Save and close<\u002Fdiv>\n        <div style=\"border:1px solid #B9B9B9;background:#fff;color:#373538;border-radius:6px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;\" sc-camel-on-click=\"{{ discardClose }}\">Discard changes<\u002Fdiv>\n        <div style=\"margin-left:auto;border:1px solid transparent;color:#373538;border-radius:6px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;\" sc-camel-on-click=\"{{ cancelClose }}\">Keep editing<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;reportingYear&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ia&quot;,&quot;workflow&quot;,&quot;entryNew&quot;,&quot;entry&quot;,&quot;entryReturned&quot;,&quot;entryClosed&quot;,&quot;wizard&quot;,&quot;submit&quot;,&quot;country&quot;,&quot;dashboard&quot;,&quot;dashboardExpanded2&quot;,&quot;mails&quot;],&quot;default&quot;:&quot;ia&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen:null, showNotes:false, wizardSection:0, wizardNav:'sidebar', dashTab:'projects', filters:{}, openFilter:null, submitOpen:false, reviewMode:'queue', editMode:false };\n  hdrRef = React.createRef();\n  ctryHdrRef = React.createRef();\n  syncHeaderHeights(){\n    [[this.hdrRef,'--rep-hdr'],[this.ctryHdrRef,'--ctry-hdr']].forEach(([r,v])=>{\n      const el = r.current; if(!el) return;\n      const card = el.parentElement; if(!card) return;\n      card.style.setProperty(v, el.offsetHeight+'px');\n    });\n  }\n  componentDidMount(){ this.syncHeaderHeights(); this._hdrOnResize = ()=>this.syncHeaderHeights(); window.addEventListener('resize', this._hdrOnResize); }\n  componentDidUpdate(){ this.syncHeaderHeights(); }\n  componentWillUnmount(){ if(this._hdrOnResize) window.removeEventListener('resize', this._hdrOnResize); }\n  go(id){ if(!id) return; if(id==='countryNone') this.setState({subTab:'country'}); this.setState({ screen:id, reviewMode:'queue', editMode:false, dashReport:null, soloMode:null, compState:null, retEdit:false, wizFrom:null, draftStarted:false, confirmClose:false, ctryState:null, ctryAction:null }); }\n\n  renderVals(){\n    const S = this.state;\n    const screen = S.screen || this.props.defaultScreen || 'ia';\n    const year = this.props.reportingYear || '2026';\n    const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];\n    const lastFriday=(y,m)=>{ const d=new Date(y, m+1, 0); d.setDate(d.getDate() - ((d.getDay()+2)%7)); return d; };\n    const firstFriday=(y,m)=>{ const d=new Date(y, m, 1); d.setDate(d.getDate() + ((5-d.getDay())+7)%7); return d; };\n    const fmtDay=(d)=>d.getDate()+' '+MONTHS[d.getMonth()];\n    const isoD=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n    const parseD=(v)=>new Date(v+'T00:00:00');\n    const defCycle=(y)=>({opens:isoD(lastFriday(y,0)), hq:isoD(firstFriday(y,3)), appr:isoD(lastFriday(y,3))});\n    const cycleFor=(y)=>((S.cycleDates||{})[y]||defCycle(Number(y)));\n    const RY=Number(year);\n    const cyc=cycleFor(RY);\n    const opensOn=parseD(cyc.opens), hqDue=parseD(cyc.hq), approvalDue=parseD(cyc.appr);\n    const opensLbl=fmtDay(opensOn), hqDueLbl=fmtDay(hqDue)+' '+RY, approvalLbl=fmtDay(approvalDue)+' '+RY;\n    const nextOpensLbl=fmtDay(parseD(cycleFor(RY+1).opens))+' '+(RY+1);\n    const cY=S.cycleYear||RY, cSaved=cycleFor(cY), cDraft=(S.cycleDraft||{})[cY]||cSaved;\n    const cLocked=cY<RY;\n    const cErr=!(cDraft.opens&&cDraft.hq&&cDraft.appr) ? 'All three dates are required.' : (!(cDraft.opens<cDraft.hq&&cDraft.hq<cDraft.appr) ? 'Dates must be in order: reporting opens → Country Manager to HQ → HQ final approval.' : '');\n    const cDirty=JSON.stringify(cDraft)!==JSON.stringify(cSaved);\n    const setDraft=(k)=>(e)=>{ const v=e.target.value; this.setState(st=>({cycleDraft:{...(st.cycleDraft||{}),[cY]:{...cDraft,[k]:v}}, cycleMsg:''})); };\n    const cycInput='width:180px;box-sizing:border-box;border:1px solid #B9B9B9;border-radius:4px;padding:8px 10px;font:inherit;font-size:14px;color:#373538;background:'+(cLocked?'#F7F7F5':'#fff')+';';\n    const RED='#E30A0B', TXT='#373538', MUT='#7F7D7C', BOR='#D9D9D9';\n    const TAG = {\n      grey:'#E7E5E7', blue:'#A4DDEE', pink:'#F27581', softyellow:'#FCFBB0', yellow:'#F7F41B', green:'#5CFF93', red:'#FF5C5C', white:'#fff'\n    };\n    const tag = (c)=>'display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:3px;font-size:14px;line-height:18px;color:#000;background:'+c+';';\n\n    const SCR = [\n      {id:'ia',label:'00A IA'},\n      {id:'workflow',label:'00B Workflow'},\n      {id:'component',label:'00C Internal reporting component'},\n      {id:'countryComponent',label:'00D Country reporting component'},\n      {id:'mails',label:'00E Notifications'},\n      {id:'entryNew',label:'01 Application open'},\n      {id:'entry',label:'01b Saved draft'},\n      {id:'entryReturned',label:'01c Returned'},\n      {id:'entryClosed',label:'01d Nothing due'},\n      {id:'wizard',label:'01e Wizard'},\n      {id:'wizardError',label:'01f Validation'},\n      {id:'submit',label:'01g Submit'},\n      {id:'country',label:'02 Country review'},\n      {id:'countryAll',label:'02b Country review - for all'},\n      {id:'countryEmpty',label:'02c Country review - none awaiting'},\n      {id:'countryNone',label:'02d Country review - no country report due'},\n      {id:'dashboardExpanded2',label:'03 HQ internal reporting overview'},\n    ];\n    const pills = SCR.map(s=>{ const a=s.id===screen; return {\n      label:s.label,\n      style:'flex:none;padding:6px 12px 8px;font-size:14px;white-space:nowrap;cursor:pointer;'+(a\n        ?'font-weight:700;color:'+TXT+';border:1px solid '+TXT+';border-bottom:2px solid '+TXT+';background:#fff;'\n        :'font-weight:400;color:'+MUT+';border:1px solid transparent;'),\n      go:()=>this.go(s.id)\n    };});\n\n    // 02 workflow\n    const workflowRows = [\n      ['1','Draft','Country Office','Complete the form','Auto on create',TAG.grey],\n      ['2','In Progress','Country Office','Answer required questions','Save button',TAG.softyellow],\n      ['3','Submitted for Country Approval','Country Office → CM','Country Manager review','Submit button',TAG.yellow],\n      ['4','Pending Country Approval','Country Manager','Approve or request changes','Flow',TAG.yellow],\n      ['5','Returned to Country Office','Country Office','Revise and resubmit','Request changes',TAG.red],\n      ['6','Pending HQ Approval','Headquarters','Final approval or return','CM approval',TAG.yellow],\n      ['7','Returned for Revision','Country Office','Revise and resubmit','HQ return',TAG.red],\n      ['8','Approved','Locked · read-only','Surfaces on HQ dashboard','HQ approval',TAG.green],\n    ].map(r=>({n:r[0],status:r[1],owner:r[2],action:r[3],setter:r[4],tagStyle:tag(r[5])}));\n\n    // sections / wizard\n    const QH = {\n      q1:'1. Is the reach disaggregated by…',\n      q2:'2. People reached by age and sex',\n      q3:'3. People reached by population group',\n      q4:'4. Sector indicators — Health',\n      q5:'5. Targets vs. results',\n      q6:'6. Narrative — progress against strategic results',\n      q7:'7. Deviations from plan',\n      q8:'8. Protection, Gender and Inclusion (PGI)',\n      q9:'9. Community Engagement & Accountability (CEA)',\n      q10:'10. MHPSS activities delivered',\n      q11a:'11.1 · Title & identification',\n      q11b:'11.2 · Background & context',\n      q11c:'11.3–11.9 · Problem, action, results, lessons, recommendations, good practices, voices',\n      q12:'12. Does this section apply to the project?',\n      q13:'13. Exit and transition',\n      q14:'14. Attachments',\n    };\n    const retEdit = !!S.retEdit;\n    const blankEdit = !retEdit && (screen==='wizard' || screen==='entry' || screen==='entryNew' || (screen==='component' && S.compState==='edit'));\n    const WS=[\n      {n:'1',name:'Project Reach',pct:100},\n      {n:'2',name:'Strategic Results',pct:60},\n      {n:'3',name:'Cross-Cutting Results',pct:35},\n      {n:'4',name:'Story of Change',pct:0},\n      {n:'5',name:'End of Emergency Intervention',pct:0},\n    ];\n    const RET_PCT = [100,100,92,85,85];\n    const pctOf = (w,i)=> blankEdit ? 0 : (retEdit ? RET_PCT[i] : w.pct);\n    const sections = WS.map((w,i)=>{ const a=i===S.wizardSection; const pct = pctOf(w,i); const done=pct===100; return {\n      n:w.n, name:w.name, pctLabel:pct+'%', done,\n      barStyle:'height:100%;width:'+pct+'%;background:'+(done?TAG.green:RED)+';border-radius:99px;',\n      numStyle:'flex:none;width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;'+(done?'background:'+TAG.green+';color:#000;':(a?'background:'+RED+';color:#fff;':'background:#E7E5E7;color:'+TXT+';')),\n      rowStyle:'display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:6px;cursor:pointer;border:1px solid '+(a?TXT:'transparent')+';background:'+(a?'#fff':'transparent')+';',\n      nameStyle:'font-size:14px;font-weight:'+(a?'700':'400')+';color:'+(a?TXT:'#6D6B69')+';',\n      hRowStyle:'flex:1 1 0;min-width:0;padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;border:1px solid '+(a?TXT:'transparent')+';background:'+(a?'#fff':'transparent')+';',\n      hNameStyle:'flex:1 1 auto;min-width:0;font-size:12px;line-height:15px;overflow-wrap:anywhere;font-weight:'+(a?'700':'400')+';color:'+(a?TXT:'#6D6B69')+';',\n      go:()=>this.setState({wizardSection:i})\n    };});\n    const overall = Math.round(WS.reduce((s,w,i)=>s+pctOf(w,i),0)/WS.length);\n\n    const NOTES = {\n      ia:[\n        {c:'Component container + Tab list',d:'Add a 4th tab to the existing project-detail tab control. No new screen — same TabControl pattern as Overview / Information / Milestones.'},\n        {c:'Dataverse / SharePoint list',d:'One \"Project Report\" record per project per reporting year, related to the existing Project table by Project ID.'},\n        {c:'Security roles',d:'Four roles map to the four areas. Row-level security on the country office column controls who sees what.'},\n        {c:'Separate app / screen for HQ',d:'The dashboard is portfolio-wide, so it reads across all country offices — keep it as its own screen with elevated HQ permissions.'},\n      ],\n      workflow:[\n        {c:'Choice column: Status',d:'Single global Choice (option set) with the 8 values. Drives every tag colour via a colour-map in the app.'},\n        {c:'Power Automate flow',d:'On submit / approve / return, a cloud flow patches Status, sets the current holder, stamps the date and emails the next approver.'},\n        {c:'Patch() on actions',d:'Each button (Submit, Approve, Return) is a single Patch() that writes Status + a row to the Comments/audit table.'},\n        {c:'Audit trail',d:'Every transition writes to a related \"Report Activity\" table so the timeline (screen 05) can render history.'},\n      ],\n      entry:[\n        {c:'Tab control item',d:'\"Internal reporting\" added to the project tab strip with a NEW badge. Visible to all roles; actions gated by status + role.'},\n        {c:'Due notice (conditional)',d:'Shown while the cycle is open and the report is not yet approved. Text and day count are calculated from the deadline date on the reporting-cycle record.'},\n        {c:'Current reports gallery',d:'One row per report for the open reporting year, filtered to this project. OnSelect navigates into the wizard at the last section the user worked on.'},\n        {c:'Previous reports gallery',d:'Same table bound to earlier reporting years, sorted newest first. Approved rows open the form in read-only DisplayMode.'},\n        {c:'Progress = calculated',d:'Completion % is answered-required ÷ total-required, rolled up per report. Stored so the dashboard can read it.'},\n      ],\n      wizard:[\n        {c:'Edit form + data cards',d:'Each section is an Edit form. Question types map to data cards: Text input, Rich text editor, Dropdown, Toggle, Rating, Attachment.'},\n        {c:'Disaggregation tables',d:'Age/Gender & population tables are an editable Gallery of numeric inputs; row + column totals are calculated labels.'},\n        {c:'Explicit save',d:'The Save button in the footer runs Patch() to the draft record; the status label shows \"Saved just now\". Closing with unsaved edits raises a confirm dialog (Save and close / Discard / Keep editing).'},\n        {c:'Stepper navigation',d:'Left section list is a Gallery; the variant toggle swaps it for a horizontal stepper — same underlying state variable.'},\n        {c:'Validation',d:'Required cards use DisplayMode + error styling; Next is enabled via a CountRows() check on unanswered required questions.'},\n      ],\n      submit:[\n        {c:'Validation summary',d:'A gallery of incomplete required questions; Submit button DisplayMode = Disabled until empty.'},\n        {c:'Confirm dialog',d:'A container overlay (not a native popup) so it is styleable and testable. Confirm runs the submit Patch + flow.'},\n        {c:'Timeline gallery',d:'Vertical Gallery bound to the Report Activity table, newest first, with colour-mapped status dots.'},\n        {c:'Status header',d:'Reused component across wizard, submit and review screens — single source of truth for the tag.'},\n      ],\n      country:[\n        {c:'Review queue (gallery)',d:'A \"My reviews\" Gallery filtered to Status = Pending Country Approval AND the Director\\u2019s country office, sorted by days waiting.'},\n        {c:'Editable form for reviewers',d:'A View / Edit toggle flips the Edit form between View and Edit DisplayMode. Country Office staff stay locked while the report is under review.'},\n        {c:'Comments table',d:'Comments are a related table keyed to section/question; the side panel is a Gallery filtered to this report.'},\n        {c:'Approve / Request changes',d:'Two Patch() commands → \"Pending HQ Approval\" or \"Returned to Country Office\", each writing a comment + activity row.'},\n        {c:'Notification flow',d:'Power Automate emails the Country Office (on return) or HQ reviewers (on approve) with a deep link to the report.'},\n      ],\n      hq:[\n        {c:'Portfolio review queue',d:'The same queue Gallery, filtered to Status = Pending HQ Approval across every country office, oldest first.'},\n        {c:'Editable form + same component',d:'HQ reuses the Country review screen (role = HQ). Action labels become \"Final approval\" / \"Return for revision\".'},\n        {c:'Country comments visible',d:'The comments Gallery shows the full thread including the Country Manager\\u2019s notes — filter by author for clarity.'},\n        {c:'Final approval Patch',d:'Sets Status = Approved, stamps Approval date, locks the form to read-only and surfaces it on the HQ dashboard.'},\n        {c:'Return for revision',d:'Sets Status = Returned for Revision, routes back to the Country Office and re-opens the form for editing.'},\n      ],\n      dashboard:[\n        {c:'Separate HQ screen / app',d:'Reads across every country office, so it needs portfolio-wide permissions. Cards are calculated over the full Reports table.'},\n        {c:'Summary cards',d:'Each card = a CountRows(Filter(Reports, Status = …)) label. Cheap, delegable on Dataverse.'},\n        {c:'Filter dropdowns',d:'Year / Country / Region / Type / Status combo boxes patch context variables used in the gallery Filter().'},\n        {c:'Table = Gallery',d:'The project table is a flexible-height Gallery; columns are labels. Sort/search via the search box + SortByColumns().'},\n        {c:'Charts',d:'Native Power Apps charts or a simple bar gallery. Or embed an existing Power BI tile.'},\n      ],\n    };\n\n    // ---- 03 entry point: four states ----\n    const entryState = screen==='entryClosed' ? 'closed' : (screen==='entryNew' ? (S.draftStarted ? 'draft' : 'new') : (screen==='entryReturned' ? 'returned' : 'draft'));\n    const mkCurrent = (r)=>({...r, pctLabel:r.pct+'%', tagStyle:tag(r.tagBg),\n      barStyle:'height:
